<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Салатовый фон, а не чёрный: вкладка должна находиться взглядом и в
       тёмной теме браузера, где чёрная иконка сливается с полосой вкладок. -->
  <rect width="64" height="64" rx="14" fill="#D7FF28"/>
  <!-- «AI» из названия creAIte, нарисованное контурами, а не текстом:
       иконку рисует браузер своим шрифтом, и надпись поехала бы. -->
  <g fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round">
    <path d="M18 46 L27 18 L36 46"/>
    <path d="M21.5 38 H32.5"/>
    <path d="M46 18 V46"/>
  </g>
</svg>
